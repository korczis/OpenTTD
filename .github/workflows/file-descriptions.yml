name: File descriptions

on:
  # Only the files this check reads: a pull request that touches none of them would queue a
  # runner for a check that cannot change (tools/surfaces/test_checker_workflows.py).
  pull_request:
    paths:
    - 'src/**'
    - '.github/file-descriptions.py'
    - '.github/workflows/file-descriptions.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  file-descriptions:
    name: File descriptions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 4

    - name: Get pull-request commits
      uses: OpenTTD/actions/checkout-pull-request@v7

    - name: Check descriptions of source files
      run: |
        git diff-tree --no-commit-id --name-only -r HEAD HEAD^ > modified_files.txt
        cat modified_files.txt
        set -ex
        python3 .github/file-descriptions.py modified_files.txt
