name: Research Rust

# Fork-owned workflow, not part of upstream's CI. Runs the mcp-rhai tests that carry the Battlebrain
# boundaries (rule project.decision-authority-boundaries, B1-B8 in src/authority_boundaries.rs),
# the decision contract and executor (battlebrain_contract.rs, bin/battlebrain.rs,
# panel_decision.rs), the knapsack checks (cargo.rs), the battle post-mortem's causes
# (postmortem.rs, bin/battle-postmortem.rs) and the cutover rehearsal
# (tools/research/battlebrain-cutover-check), so a pull request cannot merge with them failing.
# It also builds the performance benchmarks and checks their records (research/rust-bench.md).
# The job always reports, so "Research Rust tests" can be a required check: when no path
# the tests compile or read changed, it succeeds without building (.ai/repo/workflows/delivery.md).

on:
  push:
    branches: [master]
  # The same paths as the job's own change check below, so a pull request that touches none of
  # them queues no runner (tools/surfaces/test_checker_workflows.py keeps the two lists equal).
  pull_request:
    paths:
    - 'tools/research/mcp-rhai/**'
    - 'tools/research/schema/**'
    - 'tools/research/prismatic-ai/**'
    - 'tools/research/real-world/**'
    - 'tools/research/mcp-panel/**'
    - 'tools/research/town-model/**'
    - 'research/results/**'
    - 'research/battlebrain/**'
    - 'research/prismatic-bridge/**'
    - 'research/mechanisms/**'
    - '.ai/repo/knowledge/curated/the-panel-bus-carries-these-event-kinds.md'
    - 'src/window_type.h'
    - '.github/workflows/research-rust.yml'
    - '.gitmodules'
    - 'tools/research/vendor/**'
    - 'tools/research/algoglyph-pin'
    - 'tools/research/test_algoglyph_pin.py'
    - 'tools/research/battlebrain-cutover'
    - 'tools/research/battlebrain-cutover-check'
    - 'tools/research/mcp-fake-game'
    - 'tools/research/mcp-approval-ui-check'
    - 'tools/research/rust-bench'
    - 'tools/research/test_rust_bench.py'
  # Manual runs. No CI job pushes to a pull request's branch any more (surfaces.yml, the note
  # above `pages`), so nothing dispatches this workflow there.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  MANIFEST: tools/research/mcp-rhai/Cargo.toml
  RUST_TOOLCHAIN: "1.90.0"
  # The system libduckdb the `store` feature links (build.rs, Cargo.toml). It must be the DuckDB
  # release that the locked libduckdb-sys encodes (1.MMmmpp.x, so 1.10506.1 is 1.5.6); the first
  # step after checkout refuses a mismatch. The digest is the release asset's published SHA-256.
  DUCKDB_VERSION: "1.5.6"
  DUCKDB_SHA256: b845005f5132a7d8180057c35e14a7626632258782f871a90861b19c1c03841b

jobs:
  test:
    name: Research Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The AlgoGlyph submodule too: mcp-rhai links its crate algoglyph-kernels by path (ADR 0039,
      # I0227), and the native tests read its pin record. It has no submodules of its own.
      - name: "Checkout (full history, no blobs: the change set and build.rs read git; the AlgoGlyph submodule)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true

      # The paths the four test binaries compile or read: the crate and its path dependency, the
      # schemas and fixtures, PrismaticAI (info.nut), the results and documents the tests open
      # (research/battlebrain, research/prismatic-bridge, research/results, the bus knowledge
      # page, research/mechanisms, src/window_type.h, the panel's static and Rhai files, the
      # town model), and this workflow.
      - name: Did a path the tests compile or read change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) base="$BEFORE" ;;
            *) base=$(git merge-base origin/master HEAD) ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null \
            || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "No usable base ($EVENT, '$base'): running every test."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(tools/research/(mcp-rhai|schema|prismatic-ai|real-world|mcp-panel|town-model)/'
          pattern+='|research/(results|battlebrain|prismatic-bridge|mechanisms)/'
          pattern+='|\.ai/repo/knowledge/curated/the-panel-bus-carries-these-event-kinds\.md$'
          pattern+='|tools/research/mcp-(fake-game|approval-ui-check)$'
          pattern+='|tools/research/(battlebrain-cutover|battlebrain-cutover-check)$'
          pattern+='|src/window_type\.h$|\.github/workflows/research-rust\.yml$'
          pattern+='|\.gitmodules$|tools/research/vendor/'
          pattern+='|tools/research/(algoglyph-pin|test_algoglyph_pin\.py|rust-bench|test_rust_bench\.py)$)'
          matched=$(git diff --name-only "$base" HEAD | grep -E "$pattern" || true)
          if [ -n "$matched" ]; then
            echo "Changed since $base:"
            echo "$matched"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No path the tests compile or read changed since $base: nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The AlgoGlyph pin record is the gitlink's and lists every kernel the stack needs
        if: steps.changes.outputs.run == 'true'
        run: |
          tools/research/algoglyph-pin check
          python3 -B -m unittest tools/research/test_algoglyph_pin.py

      # The benchmark records (research/rust-bench.md): the tool's own tests, every committed
      # record against its schema, and every record's page current. No benchmark runs here:
      # hosted runners differ run to run, so a regression is checked on a fixed host
      # (tools/gate.sh full), never in CI.
      - name: rust-bench (its tests, the committed records and their pages)
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -B -m unittest tools/research/test_rust_bench.py
          records=$(git ls-files 'research/results/bench-*.json')
          if [ -n "$records" ]; then tools/research/rust-bench validate $records; fi
          tools/research/rust-bench render --check

      - name: The pinned DuckDB is the one the locked libduckdb-sys encodes
        if: steps.changes.outputs.run == 'true'
        run: |
          lock=$(awk '/^name = "libduckdb-sys"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' \
            tools/research/mcp-rhai/Cargo.lock)
          enc=$(echo "$lock" | cut -d. -f2)
          want="$((enc / 10000)).$(((enc / 100) % 100)).$((enc % 100))"
          echo "libduckdb-sys $lock encodes DuckDB $want; the workflow pins $DUCKDB_VERSION."
          if [ "$want" != "$DUCKDB_VERSION" ]; then
            echo "::error::Update DUCKDB_VERSION and DUCKDB_SHA256 in research-rust.yml to DuckDB $want."
            exit 1
          fi

      - name: Install libduckdb (pinned release, checksum verified)
        if: steps.changes.outputs.run == 'true'
        run: |
          dir="$RUNNER_TEMP/duckdb"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/libduckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  $RUNNER_TEMP/libduckdb.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/libduckdb.zip" libduckdb.so duckdb.h -d "$dir"
          echo "DUCKDB_LIB_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir" >> "$GITHUB_ENV"

      - name: Install the Rust toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cache cargo (registry and the crate's target, keyed by Cargo.lock)
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/research/mcp-rhai/target
          key: research-rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-duckdb${{ env.DUCKDB_VERSION }}-${{ hashFiles('tools/research/mcp-rhai/Cargo.lock') }}
          restore-keys: |
            research-rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-duckdb${{ env.DUCKDB_VERSION }}-

      - name: Fetch the locked dependencies
        if: steps.changes.outputs.run == 'true'
        run: cargo fetch --locked --manifest-path "$MANIFEST"

      - name: cargo test --release (battlebrain, mcp-plan, mcp-intent, mcp-panel, battle-postmortem; default features)
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo test --release --locked --offline --manifest-path "$MANIFEST" \
            --bin battlebrain --bin mcp-plan --bin mcp-intent --bin mcp-panel --bin battle-postmortem

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "22"

      # The web panel's Approve and Deny in Chrome: the real mcp-panel against a stand-in game
      # (tools/research/mcp-fake-game), every answer (200/404/409/422/504) shown on the page, and
      # every line the change adds to static/app.js run there (rule project.web-ui-is-covered-end-to-end).
      - name: The panel's Approve and Deny, end to end in Chrome (tools/research/mcp-approval-ui-check)
        if: steps.changes.outputs.run == 'true'
        env:
          CHROME: /usr/bin/google-chrome
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo build --release --locked --offline --manifest-path "$MANIFEST" --bin mcp-panel
          npm ci --no-audit --no-fund --prefix tools/research/mcp-panel
          tools/research/mcp-approval-ui-check

      # The cutover runbook's script, rehearsed against the live path's stand-in game (panel.rs
      # fake_game behind real panels on loopback ports); it fails on any line of the script that
      # no scenario ran (research/battlebrain/cutover.md). Reuses the target built above.
      - name: Battlebrain cutover rehearsal (tools/research/battlebrain-cutover-check)
        if: steps.changes.outputs.run == 'true'
        run: tools/research/battlebrain-cutover-check

      # The performance benchmarks compile (benches/hot_paths.rs; the bench profile reuses the
      # release build above). They are run and compared on a fixed host only: tools/gate.sh full.
      - name: cargo bench --no-run (the benchmarks build)
        if: steps.changes.outputs.run == 'true'
        run: cargo bench --no-run --locked --offline --manifest-path "$MANIFEST" --bench hot_paths
