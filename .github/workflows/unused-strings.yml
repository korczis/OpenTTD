name: Unused strings

on:
  # Only the files this check reads: a pull request that touches none of them would queue a
  # runner for a check that cannot change (tools/surfaces/test_checker_workflows.py).
  pull_request:
    paths:
    - 'src/**'
    - '.github/unused-strings.py'
    - '.github/workflows/unused-strings.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  unused-strings:
    name: Unused strings
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Check for unused strings
      run: |
        set -ex
        python3 .github/unused-strings.py
