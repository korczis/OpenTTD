name: Surfaces

# Fork-owned workflow, not part of upstream's CI. Proves that every published surface agrees
# with the repository (Markdown regions current, every relative link and anchor resolving),
# then, from the default branch only, publishes the site to GitHub Pages and the same
# documents to the wiki. Nothing it publishes is hand-written: tools/surfaces/README.md.

on:
  # A pull request's branch is checked by its `pull_request` run (and by the run the refresh job
  # dispatches after it pushes); a second `push` run on the same commit only doubled the queue.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surfaces-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SURFACES_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ env.PUBLISH }}
    steps:
      - name: "Checkout (full history, no blobs: the charts read the commit log)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/surfaces/package-lock.json
            tools/research/mcp-panel/package-lock.json

      # Two pull requests can each be current and still merge into a stale count (both add a
      # document, both write the same number). master therefore builds from regenerated regions,
      # so the site and the wiki never skip a deploy over it; the `refresh` job below brings the
      # README itself back in step through the next pull request (tools/surfaces/refresh-branch).
      - name: Regenerate the derived regions (default branch only)
        if: env.PUBLISH == 'true'
        run: tools/surfaces/surfaces sync

      - name: Check regions, links and anchors
        run: tools/surfaces/surfaces check

      - name: The generator's own tests (refresh-branch, site-only facts; scratch repositories)
        run: python3 -B -m unittest discover -s tools/surfaces -p 'test_*.py'

      - name: Check the README scoreboard against research/results
        run: tools/research/readme-scoreboard --check

      - name: Every web UI page and control has a browser check (rule project.web-ui-is-covered-end-to-end)
        run: tools/research/e2e-coverage

      - name: Build the site
        run: tools/surfaces/surfaces site

      - name: Install the browser driver (playwright-core, from the panel's lockfile)
        run: npm ci --no-audit --no-fund --prefix tools/research/mcp-panel

      - name: The web UI's own tests, one kit and no fetch past it (rule project.web-ui-is-covered-end-to-end)
        run: node --test tools/research/mcp-panel/test/*.test.mjs

      - name: Every Mermaid diagram renders in Chrome (rule project.docs-are-derived-and-current)
        env:
          CHROME: /usr/bin/google-chrome
        run: tools/surfaces/diagrams-check

      - name: Build the wiki
        run: tools/surfaces/surfaces wiki

      - name: Upload the site
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/web/site
          # Every .ai/ page lives under a dot directory, which the action leaves out by default:
          # without this the site links them and Pages answers 404.
          include-hidden-files: true

      - name: Upload the wiki
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wiki
          path: target/web/wiki
          retention-days: 1

  # Keeps every same-repository pull request current with master: merges master into its branch,
  # regenerates the derived regions, pushes the result as a fast-forward (never a force), and
  # dispatches this workflow and Research Rust on the branch, because a push made with GITHUB_TOKEN
  # starts no workflow; the dispatched runs report "Check and build" and "Research Rust tests" on
  # the new head. On a pull request it
  # refreshes that branch; on a push to the default branch, every open pull request with auto-merge.
  refresh:
    name: Refresh branches against master
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    concurrency:
      group: refresh-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Merge master into the branches and regenerate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$HEAD_REF" ]; then
            branches="$HEAD_REF"
          else
            branches=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json headRefName,isCrossRepository,autoMergeRequest \
              --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not)) | .headRefName')
          fi
          for b in $branches; do
            set +e
            tools/surfaces/refresh-branch --push "$b"
            rc=$?
            set -e
            if [ $rc -eq 3 ]; then
              gh workflow run surfaces.yml -R "$GITHUB_REPOSITORY" --ref "$b"
              # The other check a pull request's new head needs (.github/workflows/research-rust.yml).
              gh workflow run research-rust.yml -R "$GITHUB_REPOSITORY" --ref "$b"
            fi
          done

  pages:
    name: Publish the site
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  wiki:
    name: Publish the wiki
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wiki
          path: wiki

      - name: Push the pages to the wiki repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet --depth 1 "$url" wiki-repo; then
            echo "::error::${GITHUB_REPOSITORY} has no wiki repository yet. GitHub creates it with the first page: open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki, save any page once, then re-run this workflow."
            exit 1
          fi
          rsync -a --checksum --delete --exclude .git --exclude surface.json wiki/ wiki-repo/
          cd wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is current at ${GITHUB_SHA}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push --quiet
          echo "The wiki now matches ${GITHUB_SHA}."
