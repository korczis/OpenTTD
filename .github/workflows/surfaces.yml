name: Surfaces

# Fork-owned workflow, not part of upstream's CI. Proves that every published surface agrees
# with the repository (Markdown regions current, every relative link and anchor resolving),
# then, from the default branch only, publishes the site to GitHub Pages and the same
# documents to the wiki. Nothing it publishes is hand-written: tools/surfaces/README.md.

on:
  # A pull request's branch is checked by its `pull_request` run; a second `push` run on the same
  # commit only doubled the queue.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref supersedes an older one, dispatched runs included, so a run on a
# pull request's superseded head does not hold a runner. The default branch never cancels: each
# of its runs publishes the site.
concurrency:
  group: surfaces-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  SURFACES_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ env.PUBLISH }}
    steps:
      - name: "Checkout (full history, no blobs: the charts read the commit log)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/surfaces/package-lock.json
            tools/research/mcp-panel/package-lock.json

      # Two pull requests can each be current and still merge into a stale count (both add a
      # document, both write the same number). master therefore builds from regenerated regions,
      # so the site and the wiki never skip a deploy over it; the `refresh` job below brings the
      # README itself back in step through the next pull request (tools/surfaces/refresh-branch).
      - name: Regenerate the derived regions (default branch only)
        if: env.PUBLISH == 'true'
        run: tools/surfaces/surfaces sync

      - name: Check regions, links and anchors
        run: tools/surfaces/surfaces check

      - name: The generator's own tests (refresh-branch, site-only facts; scratch repositories)
        run: python3 -B -m unittest discover -s tools/surfaces -p 'test_*.py'

      - name: Check the README scoreboard against research/results
        run: tools/research/readme-scoreboard --check

      - name: Every web UI page and control has a browser check (rule project.web-ui-is-covered-end-to-end)
        run: tools/research/e2e-coverage

      - name: Build the site
        run: tools/surfaces/surfaces site

      - name: Install the browser driver (playwright-core, from the panel's lockfile)
        run: npm ci --no-audit --no-fund --prefix tools/research/mcp-panel

      - name: The web UI's own tests, one kit and no fetch past it (rule project.web-ui-is-covered-end-to-end)
        run: node --test tools/research/mcp-panel/test/*.test.mjs

      # Every test_*.py of the repository under line tracing; a changed Python line no test ran
      # fails the job, by file and line. C++, Rust and JavaScript are named as not judged yet.
      - name: Every changed Python line runs under a test (rule project.new-code-tested)
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B tools/coverage/changed-lines

      - name: Every Mermaid diagram renders in Chrome (rule project.docs-are-derived-and-current)
        env:
          CHROME: /usr/bin/google-chrome
        run: tools/surfaces/diagrams-check

      - name: Every declared page works in Chrome, light and dark, desktop and phone (tools/surfaces/README.md)
        env:
          CHROME: /usr/bin/google-chrome
        run: tools/surfaces/pages-check

      - name: Build the wiki
        run: tools/surfaces/surfaces wiki

      - name: Upload the site
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/web/site
          # Every .ai/ page lives under a dot directory, which the action leaves out by default:
          # without this the site links them and Pages answers 404.
          include-hidden-files: true

      - name: Upload the wiki
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wiki
          path: target/web/wiki
          retention-days: 1

  # No job pushes to a pull request's branch. A `refresh` job used to merge master into every
  # open auto-merge branch on each push to master, as github-actions[bot] with GITHUB_TOKEN, and
  # dispatch Surfaces (later Research Rust too) on it. A bot-pushed head never merged: its
  # pull_request workflows end `action_required` with no jobs, and although the dispatched run
  # passed "Check and build" on that head, the pull request stayed BLOCKED until a human pushed.
  # With `strict: false` a branch behind master merges anyway, so the job only stranded pull
  # requests and filled the runner queue. Refreshing from CI again needs a push that starts
  # pull_request workflows (an App or PAT token), which is the owner's call; until then the
  # branch's owner runs tools/surfaces/refresh-branch (tools/surfaces/README.md, "Parallel merges").
  pages:
    name: Publish the site
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  wiki:
    name: Publish the wiki
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wiki
          path: wiki

      - name: Push the pages to the wiki repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet --depth 1 "$url" wiki-repo; then
            echo "::error::${GITHUB_REPOSITORY} has no wiki repository yet. GitHub creates it with the first page: open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki, save any page once, then re-run this workflow."
            exit 1
          fi
          rsync -a --checksum --delete --exclude .git --exclude surface.json wiki/ wiki-repo/
          cd wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is current at ${GITHUB_SHA}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push --quiet
          echo "The wiki now matches ${GITHUB_SHA}."
