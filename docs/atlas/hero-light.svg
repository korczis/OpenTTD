.num{fill:#ece4d6;font-size:13px;font-weight:700}
.numbox{fill:#0b0b0b}
.numbox.hot{fill:#d11f1a}
.name{fill:#0b0b0b;font-size:17px;font-weight:700;letter-spacing:.12em}
.code{fill:#0b0b0b;font-size:14px}
.code.hot{fill:#d11f1a}
.note{fill:#8a8a8a;font-size:12.5px}
.rule{stroke:#0b0b0b;stroke-opacity:.25;stroke-width:1}
.boundary{stroke:#d11f1a;stroke-width:1.5;stroke-dasharray:6 5}
.blabel{fill:#d11f1a;font-size:11px;letter-spacing:.16em}
.foot{fill:#8a8a8a;font-size:11px}
.step{opacity:1}
.done{opacity:1}
.mover{opacity:0}
@media (prefers-reduced-motion:no-preference){
.route{animation:draw 12s ease-in-out infinite}
.s1{animation:s1 12s infinite}.s2{animation:s2 12s infinite}.s3{animation:s3 12s infinite}.s4{animation:s4 12s infinite}.s5{animation:s5 12s infinite}
.mover{animation:mover 12s infinite}
.parked{animation:parked 12s infinite}
.done{animation:done 12s infinite}
}
