id: I0134
milestone: prismatic-ai-grows-its-fleet-and-survives-its-own-failures
title: "PrismaticAI loads the town-authority model, logs each served town's rating band, and consults it before one station build that is A/B-tested"
slug: prismatic-ai-uses-town-model
priority: p2
profile: implementation
parallel_safe: false
objective: "Require town_model.nut and town.nut from main.nut, log TownReport monthly for every town where the bot has a station, and gate one build (an airport whose site clears trees) on TownSurelyAllowsStation behind a setting that defaults off until held-start pairs favour it."
why: "External review 2026-11-22 (digest B-46): the town-authority model is generated into the bot but not wired. main.nut requires sixteen files and neither town.nut nor town_model.nut (tools/research/prismatic-ai/PrismaticAI/main.nut:98-113), and TownBand, TownRatingFloor, TownSurelyAllowsStation and TownReport (town.nut:13,21,28,44) have no caller. town.nut's own header limits use to logs and to A/B-tested decisions, because two decisions built on the band's lower bound lost in replays (town.nut:6-10; knowledge levelling-an-airport-site-clears-trees-and-costs-town-rating)."
scope:
  - "tools/research/prismatic-ai/PrismaticAI/main.nut"
  - "tools/research/prismatic-ai/PrismaticAI/town.nut"
  - "tools/research/prismatic-ai/PrismaticAI/air.nut"
  - "tools/research/prismatic-ai/PrismaticAI/info.nut"
  - "tools/research/prismatic-ai/README.md"
  - "research/mechanisms/town-authority.md"
  - "research/results/**"
non_scope:
  - "town_model.nut, which is generated by tools/research/town-model/derive.py and not edited"
  - "Statues (statues.nut) and other town actions"
depends_on:
  - I0128
serves:
  - "the-research-bot-competes-and-its-losses-are-explained#prismatic-ai-grows-and-recovers"
acceptance_criteria:
  - "Both files are required; the script still loads within the AI start-up limits on the fitness seed, and its standings are unchanged with the new setting off"
  - "A monthly log line per served town carries TownReport's band and floor"
  - "With the setting on, an airport build checks TownSurelyAllowsStation with the trees its levelling clears and skips a site that would be refused; the skip is logged"
  - "Held-start pairs on three seeds decide the default; research/mechanisms/town-authority.md says how the bot uses the model"
validation:
  - "python3 -B tools/research/prismatic-ai/derive_docs.py --check"
  - "python3 -m unittest tools/research/test_ai_battle.py tools/research/test_prismatic_ai_docs.py tools/research/test_town_model_index.py"
  - "python3 tools/research/ai-battle/battle.py fitness"
  - "tools/surfaces/surfaces check"
evidence_required:
  - validation_run
  - artifact
created_at: '2026-11-22'
updated_at: '2026-11-22'
