id: I0221
milestone: prismatic-steers-a-company-through-the-bridge
title: "The planner picks every AlgoGlyph kernel it calls by capability from the discovered catalogue, refuses with the matcher's reason when none matches, keeps its declared fallback, and records which kernel of which catalogue it relied on"
slug: planner-kernels-by-capability
priority: p1
profile: implementation
parallel_safe: false
objective: "The planner's own kernel calls go through the matcher of I0098 (match_capability over CAPABILITIES and ADAPTERS in battlebrain_contract.rs): the portfolio (cargo.rs, portfolio-within-budget), the rail line price and the transfer yards (linecost.rs and yards.rs, rail-line-price) and the investment run (invest.rs, a new routes-by-return capability with its adapter and domain check). The catalogue is the one the runner reports (flow -- kernels, with the checkout's commit) or a file (mcp-plan --catalogue). A call builds its input keys and reads its answer through the chosen kernel's adapter, so no planner code names a kernel. With no match the call is not made and the refusal is the matcher's own; the portfolio still falls back to its built-in DP, labelled as such with the refusal as its reason. mcp-plan writes the capability-match/v1 decision of every capability it resolved under kernels, and each answer that used a kernel names its capability and the catalogue's digest and commit."
why: "I0098 left the planner's own calls outside the matcher (its non_scope): the planner still called knapsack-dp, track-planning and transport-investment by name, which is a second, hand-kept kernel list beside the adapter registry, and its records did not say which catalogue a kernel came from."
scope:
  - "tools/research/mcp-rhai/src/cargo.rs"
  - "tools/research/mcp-rhai/src/linecost.rs"
  - "tools/research/mcp-rhai/src/yards.rs"
