acceptance_criteria:
  - "on the real catalogue fixture the planner resolves portfolio-within-budget to knapsack-dp, rail-line-price to track-planning and routes-by-return to transport-investment, and writes each capability-match/v1 decision under kernels (unit tests)"
  - "with a catalogue in which a capability matches no kernel, the call is not made: the portfolio falls back to the built-in DP with the matcher's refusal as its fallback reason, a rail line is left unpriced with the refusal, and the investment run is refused with it (unit tests)"
  - "the kernel input keys and the answer paths are read from the chosen kernel's adapter, and no planner file names a kernel id of the catalogue in code (unit tests)"
  - "a kernel answer that fails its domain check is refused in each of the three calls (unit tests)"
validation:
  - "cargo test --release --offline --no-default-features --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-plan --bin mcp-intent --bin battlebrain"
evidence_required:
