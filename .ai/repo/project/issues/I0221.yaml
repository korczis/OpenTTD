  - "How the AlgoGlyph checkout is located, the flow serve and the catalogue discovery of the hub (feature/algoglyph-submodule)"
  - "Kernel calls outside the planner: the hub's algoglyph.* methods, the Rhai rail steward, mcp-human, the action plan and the kernel feed"
depends_on:
