id: I0195
milestone: the-live-agent-workbench
title: "Every AlgoGlyph kernel appears on its own, with its input schema, in the hub catalogue, OpenAPI, Rhai completion and the flow palette, proven by a throwaway fixture kernel"
slug: algoglyph-kernels-projected
priority: p2
profile: implementation
parallel_safe: false
objective: "Project each kernel that 'flow -- kernels' reports as its own operation (algoglyph.kernel.<id>, with the input shape the kernel declares as inputSchema and its description) in the hub method table, the panel's OpenAPI, the Rhai catalogue (so completion and hover show it), the MCP endpoint and the flow editor's palette, all from the one live listing. The generic algoglyph.kernel stays for unknown ids. A test with a throwaway fixture kernel proves it reaches every column of the parity matrix with no hand edit."
why: "External review 2026-11-22 (digest A-35). tools/research/mcp-rhai/src/hub_algoglyph.rs:45-55 declares three generic methods (algoglyph.kernels, algoglyph.kernel {kernel, input}, algoglyph.track_plan), and Rhai has only kernel(id, input) and kernels() (tools/research/mcp-rhai/src/main.rs:293-297). Kernels are therefore not individual OpenAPI operations or Rhai completions, and no test shows that a new kernel reaches any surface."
scope:
  - "tools/research/mcp-rhai/src/hub_algoglyph.rs"
  - "tools/research/mcp-rhai/src/hub.rs"
  - "tools/research/mcp-rhai/src/panel.rs"
  - "tools/research/mcp-rhai/src/rhai_catalogue.rs"
  - "tools/research/mcp-rhai/src/main.rs"
  - "research/mcp-hub.md"
non_scope:
  - "Editing AlgoGlyph; the fork uses it from outside, and the fixture kernel is injected through a fake flow CLI in the test"
depends_on:
  - I0184
serves:
  - "openttd-validates-agent-driven-engineering#the-workbench-drives-the-game-end-to-end"
acceptance_criteria:
  - "With AlgoGlyph present, every kernel of 'flow -- kernels' is one hub method, one OpenAPI operation and one Rhai function with its input schema; without it, none is listed and the generic methods say why"
  - "A test with a fixture kernel asserts it in each of those and in tools/research/mcp-parity-check's output"
  - "mcp-hub-check calls one projected kernel through the WebSocket"
validation:
  - "cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml"
  - "tools/research/mcp-hub-check"
  - "tools/research/mcp-parity-check"
evidence_required:
  - validation_run
created_at: '2026-11-22'
updated_at: '2026-11-22'
