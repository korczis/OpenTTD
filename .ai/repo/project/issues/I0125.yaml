id: I0125
milestone: prismatic-ai-grows-its-fleet-and-survives-its-own-failures
title: "PrismaticAI logs, every heartbeat, the gate that stopped it adding a vehicle, and a battle post-mortem counts which gate binds each company"
slug: prismatic-ai-names-its-binding-fleet-gate
priority: p1
profile: implementation
parallel_safe: false
objective: "Make the binding fleet cap measurable instead of guessed: InvestSurplus and AdjustFleet emit one stable line per heartbeat naming why no vehicle was added (usable money below the floor, route at its type cap, no judged vehicles, unjudged share, payback test, airport room, no depot), and the battle post-mortem tallies those reasons per PrismaticAI company from the match's decision log."
why: "External review 2026-11-22 (digest C-25): which cap keeps the fleet flat is UNKNOWN. PR #46 (4c1dc9c355) added a heartbeat line with the caps in force (tools/research/prismatic-ai/PrismaticAI/main.nut:634-636), but not which one stopped a purchase. InvestSurplus skips or returns silently at its floor, its caps, airport room, the unjudged share, the payback test, a missing depot and the loan (fleet.nut:71, 87, 89, 94, 96, 99, 101, 104, 107) and AdjustFleet at its hard-coded cap (fleet.nut:165-166). The decision log this needs is I0118's level-3 capture."
scope:
  - "tools/research/prismatic-ai/PrismaticAI/fleet.nut"
  - "tools/research/ai-battle/battle.py"
  - "tools/research/test_ai_battle.py"
  - "research/ai-battle/README.md"
non_scope:
  - "Changing any cap, threshold or default (I0126)"
  - "Logging that changes the bot's decisions or timing beyond the log line itself"
depends_on:
  - I0118
serves:
  - "the-research-bot-competes-and-its-losses-are-explained#prismatic-ai-grows-and-recovers"
acceptance_criteria:
  - "Each heartbeat logs at most one `fleet gate:` line per vehicle type naming the first gate that held, with its value and threshold"
  - "The fitness seed's standings are unchanged by the logging (same final value and vehicle count as before the change)"
  - "battle.py's post-mortem shows, per PrismaticAI company, how many heartbeats each gate held, from the level-3 log; a test covers the parser on a fixture log"
  - "research/ai-battle/README.md names the binding gate measured on one fitness match"
validation:
  - "python3 -m unittest tools/research/test_ai_battle.py"
  - "python3 tools/research/ai-battle/battle.py fitness"
  - "tools/surfaces/surfaces check"
evidence_required:
  - validation_run
created_at: '2026-11-22'
updated_at: '2026-11-22'
