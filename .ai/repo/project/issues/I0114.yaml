id: I0114
milestone: records-and-status-tell-the-truth
title: "One capability matrix states, per capability, its owner, code path, live input, fallback, tests and end-to-end status, labelled OBSERVED/DERIVED/INFERRED, and a check keeps it honest"
slug: capability-matrix
priority: p1
profile: implementation
parallel_safe: true
objective: "Write the fork's single forensic capability matrix: one row per capability (planning, track feasibility, AlgoGlyph kernels and fallbacks, the yard and transfers, accounting, renewals, subsidies, calibration, the bus and store, plan.* events, the Prismatic directive, Battlebrain, the panel and hub, MCP reads and mutations, the bridge). Each row names owner, code path with path:line, live input, fallback, provenance of its numbers, tests that cover it, end-to-end status (PASS/PARTIAL/NOT RUN with the run that proves it) and an OBSERVED/DERIVED/INFERRED label. Where existing documents already hold part of this (research/agent-loop.md stage table, research/battlebrain/README.md authority matrix, research/prismatic-mcp/05-implementation-plan.md), the matrix links or derives from them instead of restating them."
why: "External review 2026-11-22 (digest C-19, B-21 and the matrix half of A-13). Three prompt packs asked for this matrix before any further implementation, and the review itself made wrong calls (four resources, 0/146 coverage, 'blackboard not wired') because the status of MCP, planner, bridge and bot is spread across documents written at different times. ADR 0037's audit found eleven investment selectors; no document lists them all with their fallbacks."
scope:
  - "research/capability-matrix.md"
  - "research/agent-loop.md"
  - "research/battlebrain/README.md"
  - "research/prismatic-mcp/05-implementation-plan.md"
  - "tools/knowledge/**"
  - "surfaces.toml"
non_scope:
  - "Implementing missing capabilities; a missing one is a row with status NOT RUN or OPEN and the issue that owns it"
depends_on:
  - I0111
serves:
  - "openttd-validates-agent-driven-engineering#status-surfaces-match-the-code"
acceptance_criteria:
  - "research/capability-matrix.md exists with the columns above and covers at least the capabilities listed in the objective"
  - "Every path:line in the matrix resolves on master: tools/knowledge/refs check (or an equivalent) runs over the matrix and fails on a dead reference"
  - "No row says PASS without a command or committed result that proves it; NOT RUN is used where a live run is missing"
  - "README and the site link the matrix; tools/surfaces/surfaces check passes"
validation:
  - "tools/knowledge/refs check"
  - "tools/surfaces/surfaces check"
evidence_required:
  - validation_run
