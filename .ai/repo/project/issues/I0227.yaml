id: I0227
milestone: algoglyph-is-accountable
title: "AlgoGlyph is a git submodule pinned at one commit, the hub's default checkout, and its Rust kernels run in-process as native-rust entries of the discovered catalogue"
slug: algoglyph-submodule
priority: p1
profile: implementation
parallel_safe: false
objective: "Add github.com/korczis/algoglyph as a git submodule at tools/research/vendor/algoglyph, pinned to a commit whose flow CLI lists every kernel the stack uses (knapsack-dp, track-planning, transport-investment, action-plan), and record that commit's runner catalogue next to it (tools/research/vendor/algoglyph.pin.json). The hub (hub_algoglyph.rs) and mcp-e2e take the submodule as the default checkout: $MCP_ALGOGLYPH_DIR still overrides; a checkout under ~/dev is used only when its HEAD is the pinned commit. mcp-rhai depends on the submodule's crates/algoglyph-kernels by path, and every kernel of its registry that the runner does not already list becomes a catalogue entry with engine native-rust, listed by algoglyph.kernels and Rhai kernels(), and answered in-process by algoglyph.kernel and Rhai kernel() instead of through npm. One script (tools/research/algoglyph-pin) installs, checks and bumps the pin; the Research Rust workflow checks the submodule out, checks the pin and runs the native tests; tools/gate.sh checks the pin."
why: "Owner order 2026-11-22: \"algoglyph by mel byt ze git submodule a jeho rust interface integrovano do openttd rust\". Until now AlgoGlyph was whichever checkout happened to be under ~/dev (hub_algoglyph.rs default_dir, mcp-e2e's list of seven candidate directories), so the version a planner answer came from was a property of the machine, not of the repository; and AlgoGlyph's Rust crate was not reachable from the fork's Rust at all."
scope:
  - ".gitmodules"
  - "tools/research/vendor/**"
  - "tools/research/algoglyph-pin"
  - "tools/research/test_algoglyph_pin.py"
