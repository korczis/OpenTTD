  - "tools/research/mcp-rhai/src/battlebrain_contract.rs"
  - "tools/research/mcp-rhai/src/bin/mcp-kernel-feed.rs"
  - "tools/research/mcp-e2e"
  - "tools/gate.sh"
  - ".github/workflows/research-rust.yml"
  - "research/mechanisms/planner-and-algoglyph.md"
