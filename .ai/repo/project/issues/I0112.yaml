    result: "On origin/master 99e98b8adc plus this branch: .ai/repo/features/README.md defines stable (five criteria: complete on master, a feature-specific check with how it runs, its last recorded pass on a master-history commit, a current body, no product-validate error), draft (the unmet criterion named) and deprecated; the schema enum cannot carry it and product validate does not check it, which the README says. Every record has a Maturity section: embedded-mcp-server, event-bus-and-store, lan-ai-battle and battle-postmortem promoted to stable, prismatic-bridge kept draft (ADR 0032 client unbuilt, Phase 3 Partial, I0168), the five stable ones re-graded with their evidence. product validate 0 errors (was 1: published-surfaces cited tools/surfaces/README.md, not a discovered document), plan validate 0 failures, doctor exit 0, surfaces 909 documents 0 findings, refs 3376 references 0 failures, research_test.sh 51/51, battle.py check 351 records valid, battle-postmortem 22/22 and check 0 stale (eed5cb5fc5). Codex consulted (alternative; adopted: feature-specific check, evidence commit named)."
