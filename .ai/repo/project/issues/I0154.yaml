id: I0154
milestone: battlebrain-decides-live-with-rollback
title: "Battlebrain is measured against a fixed baseline: provenance share, stale-plan rejections and shadow agreement are reported, and held-start duel pairs on three seeds compare it with planner v4"
slug: battlebrain-against-fixed-baseline
priority: p2
profile: deep-work
parallel_safe: false
objective: "Define the fixed baseline (planner v4 slots, planned_freight_only=0, a pinned commit), add `battlebrain metrics` that derives from records the share of decisions with full provenance, stale-plan and gate rejections by code, and shadow agreement, and run held-start mcp-duel pairs on seeds 4242, 31337 and 20208 with Battlebrain live against that baseline. A default changes only beyond the rival's spread."
why: "External review 2026-11-22 (digest C-49, Phase 06). research/results on origin/master holds only battlebrain-shadow records; there is no Battlebrain duel or metric. The fork's held-start rule (criterion history-tuning-is-held-start-proven, I0087) is the yardstick."
scope:
