id: I0278
milestone: the-strategy-is-reviewed-on-a-cadence
title: "N's live export runs each game quarter, not only after a game, and the digest shows the GA's live vetoes and next live start"
slug: live-export-every-quarter
priority: p1
profile: implementation
parallel_safe: true
objective: "Owner: N (feature/live-outcome-learning), K (fitness safeguard), O (digest). Run battle.py live-export read-only against the running panel's store each game quarter, keeping the labels (source: live, unpaired), the change history, revision and opponent set; a live row never changes a default. The quarter digest shows which GA configurations live games vetoed and what live-start.json derives."
why: "A game that is being lost should teach the GA before it ends."
scope:
- "tools/research/ai-battle/battle.py"
- "tools/research/test_ai_battle.py"
- "tools/research/mcp-panel/rhai/digest.rhai"
non_scope:
- "Any change to the live game's state or processes"
- "Any change in prismatic-platform or algoglyph"
depends_on: []
serves:
- "the-research-bot-competes-and-its-losses-are-explained#a-gap-to-the-leader-is-detected-and-answered"
acceptance_criteria:
- "a quarterly export of a fixture store yields the same rows as a post-game export of the same period (unit test)"
- "a live row is excluded from default selection"
validation:
- "python3 -m unittest tools/research/test_ai_battle.py"
- "tools/research/mcp-digest-check"
evidence_required:
- validation_run
created_at: '2026-11-23'
