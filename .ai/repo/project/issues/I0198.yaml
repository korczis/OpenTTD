id: I0198
milestone: the-live-agent-workbench
title: "Duels and research profile runs are launched with typed parameters, followed, cancelled and found again after a reload, from the browser"
slug: research-runs-from-the-browser
priority: p2
profile: implementation
parallel_safe: false
objective: "Extend the panel's run control from 'start one duel' to a run manager: launch a duel or a tools/research/research profile run (profile, seed, horizon, baseline as typed parameters taken from the tool's own declared options), follow its progress and log, cancel it (the child and its game ports cleaned up, the record marked cancelled), and after a page reload or a panel restart find every run with its manifest and results. Routes come from the one route table, so OpenAPI, Rhai and the hub get them too."
why: "External review 2026-11-22 (digest A-25). tools/research/mcp-rhai/src/panel.rs:2346 POST /api/duel starts one duel in the background and :2361 GET /api/duel reports the one started; results are read back at :2344-2345. There is no cancel route, only one run at a time, and tools/research/research's profile runs (research/tooling.md) are not reachable from the panel at all."
scope:
  - "tools/research/mcp-rhai/src/panel_results.rs"
  - "tools/research/mcp-rhai/src/panel.rs"
  - "tools/research/mcp-panel/static/results.js"
  - "tools/research/mcp-panel/static/results.html"
  - "tools/research/mcp-panel/test/"
  - "research/mcp-control.md"
non_scope:
  - "The AI battle orchestrator and its remote dispatch (tools/research/ai-battle), which keeps its own control"
  - "Changing what a duel or a profile run computes"
depends_on: []
serves:
  - "openttd-validates-agent-driven-engineering#the-workbench-drives-the-game-end-to-end"
acceptance_criteria:
  - "POST /api/runs starts a duel or a profile run from typed parameters; GET /api/runs and /api/runs/<id> list and follow them; POST /api/runs/<id>/cancel stops one and frees its ports"
  - "A cancelled run's record says cancelled with the time and who cancelled it; a finished one links its manifest and result page"
  - "A browser check starts a short run, reloads the page, finds it, cancels it and reads the cancelled state back"
validation:
  - "cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml"
  - "node --test tools/research/mcp-panel/test/"
  - "tools/research/e2e-coverage"
evidence_required:
  - validation_run
created_at: '2026-11-22'
updated_at: '2026-11-22'
