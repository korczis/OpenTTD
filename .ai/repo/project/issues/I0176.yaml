id: I0176
milestone: prismatic-closes-one-real-loop
title: "A plan interrupted mid-build resumes without spending twice, and an owner who takes over in the GUI mid-plan stops the remaining steps"
slug: plan-resume-and-gui-override
priority: p1
profile: implementation
parallel_safe: false
objective: "Idempotency keys and step receipts persist in the store, not in process memory. A retry after a panel crash therefore replays the receipts and posts only the steps that have none. When the owner builds, removes or pauses in the GUI so that a step's precondition no longer holds, that step becomes SKIPPED_PRECONDITION, and the plan ends partial, naming the owner's action. Three scenarios are recorded live: read-only (no step posts), authorized success, and an interruption (panel killed after step k) followed by resume. One of the three includes a GUI override."
why: "External review 2026-11-22 (digest B-17, B-27). tools/research/mcp-rhai/src/panel_decision.rs:604-607 keeps idempotency keys in a process-local map (a OnceLock<Mutex<BTreeMap>>). A panel restart forgets them, and a retried pull runs anew. The only resume (POST /decision/resume, research/agent-loop.md:98-105) is in the bridge, outside this repository. On origin/master, `git grep -iE 'takeover|interrupt'` under tools/research finds no test of an interruption followed by resume, and none of an owner taking the mouse mid-build."
scope:
  - "tools/research/mcp-rhai/src/panel_decision.rs"
  - "tools/research/mcp-rhai/src/plan_dag.rs"
  - "tools/research/mcp-decision-check"
  - "research/agent-loop.md"
  - "research/results/**"
non_scope:
  - "Save-and-load recovery of PrismaticAI itself (I0136)"
  - "Undoing a partial build; it is kept and recorded (I0175)"
depends_on:
  - I0175
serves:
  - "an-agent-plays-the-game-through-governed-channels#prismatic-closes-one-real-loop"
acceptance_criteria:
  - "A test kills the executor between two steps, restarts it, and shows that the retry posts only the remaining steps and spends once"
  - "A test changes a step's precondition between steps (fixture GUI action) and gets SKIPPED_PRECONDITION and a partial outcome"
  - "mcp-decision-check runs the three live scenarios, one with a real GUI or console action by the operator, and the records are committed"
validation:
  - "cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-panel"
  - "tools/research/mcp-decision-check --scenario resume"
evidence_required:
  - validation_run
  - artifact
created_at: '2026-11-22'
updated_at: '2026-11-22'
