id: I0178
milestone: prismatic-closes-one-real-loop
title: "One run joins the whole loop: an evidence query, typed mesh records, Prismatic's live decision, an authenticated approval, the command and its observed effect, linked in one record; stopping it leaves no listener"
slug: agent-loop-one-run
priority: p1
profile: deep-work
parallel_safe: false
objective: "tools/research/agent-loop-check runs on one research stack. mcp-evidence answers the run's starting question, and its passages are cited in an observation record. The mesh receives an observation, a hypothesis and a plan record. The panel pulls Prismatic's live directive (I0168), and the directive's decision record cites those records. The operator approves under an authenticated principal (I0182). The game executes, and the verdict plus a read-back one game month later become the outcome record. One run record, keyed by I0187's request_id, links the evidence answer digest, the mesh keys, the plan.directive seq, the approval, the decision id and the verdict. When the run stops, lsof shows that no port the run opened is still listening. The check exits 3 (NOT RUN), with the reason, when prismatic_api or majordomus 1.2.0 is absent."
why: "External review 2026-11-22 (digest B-37, A-59). research/agent-loop.md lists the stages separately (:48-58) and sums them up as 'Nothing is fake, and nothing is joined up' (:62). mcp-decision-check covers decision, approval and verdict only. The panel's mesh mirroring is contract-tested only (:51). No record on origin/master links an /api/evidence answer to mesh records and a directive."
scope:
  - "tools/research/agent-loop-check"
  - "research/agent-loop.md"
  - "research/results/**"
non_scope:
  - "Calling the result retrieval-augmented generation; no model writes the answer (research/agent-loop.md:68-70)"
  - "Editing prismatic-platform or prismatic-majordomus"
depends_on:
  - I0168
  - I0172
  - I0182
  - I0187
serves:
  - "an-agent-plays-the-game-through-governed-channels#prismatic-closes-one-real-loop"
acceptance_criteria:
  - "One live run exits 0, and its record, committed under research/results/, resolves every linked id"
  - "After stop, the check's lsof step finds no listener the run opened"
  - "research/agent-loop.md replaces 'nothing is joined up' with the run's record, keeping each stage's own status"
validation:
  - "tools/research/agent-loop-check"
evidence_required:
  - validation_run
  - artifact
created_at: '2026-11-22'
updated_at: '2026-11-22'
