id: I0110
milestone: records-and-status-tell-the-truth
title: "openttd://mcp/status and the console status line report the server's real mutation capability instead of a hard-coded read_only=true"
slug: mcp-status-reports-mutation-capability
priority: p1
profile: implementation
parallel_safe: true
objective: "The status resource and `prismatic_mcp status` derive their capability fields from what the running server actually registers: whether approval-gated command tools (openttd.cmd.*), Script API tools (openttd.api.*), AI tools (openttd.ai.*), game.set_pause and interface input are present in this build and armed in this process. The literal `read_only = true` disappears; a client can tell a read-only build from a mutating one by reading status alone."
why: "External review 2026-11-22 (digest A-01, the review's top P0, the only one still untouched): src/prismatic_mcp/prismatic_mcp_server.cpp:176 sets d[\"read_only\"] = true and :1665 prints ' read_only=true', unchanged since fe6b64453d (2026-07-24), while the same server exposes approval-gated mutations. research/prismatic-mcp/07-resource-catalog.md:10 and 10-in-game-runbook.md:61 document the false field. An agent that reads status to decide whether it may act is told the wrong thing."
scope:
  - "src/prismatic_mcp/prismatic_mcp_server.cpp"
  - "src/prismatic_mcp/prismatic_mcp_detail.h"
  - "src/tests/test_prismatic_mcp.cpp"
  - "research/prismatic-mcp/07-resource-catalog.md"
  - "research/prismatic-mcp/10-in-game-runbook.md"
non_scope:
  - "Changing which tools exist or how approval works"
  - "Any savegame field (rule: no savegame field for an agent channel)"
depends_on: []
serves:
  - "openttd-validates-agent-driven-engineering#status-surfaces-match-the-code"
acceptance_criteria:
  - "The status JSON carries a `capabilities` object (for example reads, approval_gated_commands, script_api, ai_tools, pause, interface_input, each true/false) computed from the tool registry and the process's arming state; `read_only` is either removed or derived as the negation of every mutating capability, documented as such"
  - "The console line prints the same derived values"
  - "Unit tests in test_prismatic_mcp.cpp cover a registry with mutating tools (read_only false), a registry with none (read_only true) and an unarmed interface-input process"
  - "A build with OPTION_PRISMATIC_MCP_SERVER=OFF still compiles and its tests pass (the feature compiles out)"
  - "07-resource-catalog.md and 10-in-game-runbook.md show the new fields and an example line produced by a real run"
validation:
  - "tools/gate.sh change"
  - "build-mcp/openttd_test '[prismatic_mcp]'"
evidence_required:
  - validation_run
