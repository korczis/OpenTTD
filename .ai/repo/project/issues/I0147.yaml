objective: "Extend the proven yard (`mcp-human yard`, mcp-human-e2e --yard) to a working service: leg A's train unloads at the shared station with a Transfer and leave-empty order, leg B's train loads there with no unload and delivers at the final acceptor. Verify from openttd://vehicles order flags, station cargo and the companies' income that the cargo arrived as transfer, was carried on, and was paid at the acceptor with the feeder share not counted twice."
