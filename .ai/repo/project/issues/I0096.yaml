id: I0096
milestone: prismatic-steers-a-company-through-the-bridge
title: "Battlebrain runs in shadow on the planner's own snapshot: same inputs, its own freight-line decision recorded beside the planner's choice, and the executor refuses any shadow decision"
slug: battlebrain-shadow
priority: p1
profile: implementation
parallel_safe: false
objective: "For the freight-line decision, battlebrain applies policy freight-margin@1 to the candidates planner v4 produced from one captured snapshot, records the planner's choice and its own as separate candidates with a decision in mode shadow, and reports where they differ and why. A shadow decision can never be applied: the directive's decision block says mode shadow and the executor refuses it."
why: "Phase 03 of the owner-run Battlebrain prompt pack: shadow evidence is the gate before any cutover (I0095 defined the contracts)."
scope:
  - "tools/research/mcp-rhai/src/battlebrain_contract.rs"
  - "tools/research/mcp-rhai/src/battlebrain_policy.rs"
  - "tools/research/mcp-rhai/src/bin/battlebrain.rs"
  - "tools/research/mcp-rhai/src/bin/mcp-plan.rs"
  - "tools/research/mcp-rhai/src/panel_decision.rs"
  - "tools/research/schema/**"
  - "research/prismatic-bridge/decision-contract.schema.json"
  - "research/battlebrain/**"
non_scope:
  - "Cutover: no shadow decision reaches a game"
  - "Any change in prismatic-platform or algoglyph"
  - "Starting a game: captures read a running research panel only, with its owner's consent"
depends_on:
  - I0095
serves:
  - "an-agent-plays-the-game-through-governed-channels#a-decision-contract-is-defined"
acceptance_criteria:
  - "freight-margin@1 is a pure function of the planner's output, the company's money and loan headroom and its parameters, with a documented deterministic tie-break; unit tests cover adopt, HOLD on margin, HOLD on reserve and ties"
  - "the decision block carries mode shadow|live; a shadow block is refused by the executor before any step (panel_decision.rs test)"
  - "mcp-plan --capture <dir> writes every openttd:// read with its sha256 and the game tick; --snapshot <dir> replays it and refuses a file whose digest differs (test)"
  - "battlebrain shadow on a captured, token-free snapshot writes the planner's candidate, its own candidate and a shadow decision, valid against battlebrain-record/v1, and a comparison naming the solver (kernel or built-in fallback), cost, profit, payback and the reason for any divergence"
validation:
  - "cargo test --offline --manifest-path tools/research/mcp-rhai/Cargo.toml --bin battlebrain --bin mcp-plan --bin mcp-panel"
  - "tools/gate.sh change"
evidence_required:
  - validation_run
