id: I0097
milestone: prismatic-steers-a-company-through-the-bridge
title: "A Battlebrain freight-line decision can go live only through its cutover gates: a priced line, a coherent or bounded snapshot, money re-read after it, one keyed pull while fresh, and a rollback to the baseline"
slug: battlebrain-live-gates
priority: p1
profile: implementation
parallel_safe: false
objective: "Make the live half of the freight-line decision enforceable before any game sees it. Policy freight-margin@2 adopts only a line that track-planning priced (`require_priced`). `battlebrain live` refuses a snapshot wider than its declared tick window, a policy without `require_priced`, and companies read before the snapshot. It then writes one directive that sets planned_freight_only=1 and one fr_* slot. `battlebrain serve` hands that directive out once, on loopback. The executor (panel_decision.rs decision_gate) applies a live decision only through a pull keyed with its own idempotency key, on or before its stale date. `battlebrain rollback` gives the directive back to the baseline (planned_freight_only=0)."
why: "The shadow runs on real captures of the owner's co-play game (I0096) showed the planner and battlebrain each choosing unpriced or unaffordable lines. The owner chose the co-play game on :8800 for the cutover (2026-11-22), so every gate must hold before a pull is made."
scope:
  - "tools/research/mcp-rhai/src/battlebrain_policy.rs"
  - "tools/research/mcp-rhai/src/bin/battlebrain.rs"
  - "tools/research/mcp-rhai/src/panel_decision.rs"
  - "research/battlebrain/**"
  - "research/results/**"
non_scope:
  - "The live pull itself on :8800 (it needs the owner's approval of every setting change and p1's go-ahead)"
  - "Any change in prismatic-platform or algoglyph"
depends_on:
  - I0096
serves:
  - "an-agent-plays-the-game-through-governed-channels#a-decision-contract-is-defined"
acceptance_criteria:
  - "with require_priced an unpriced line is never adopted, and with it off the rule is freight-margin@1's (unit tests)"
  - "battlebrain live refuses an over-wide window, an unpriced policy and stale companies, each with its own code; it writes planned_freight_only=1 plus one fr_* slot and a live decision block; shadow never writes a directive (unit tests)"
  - "serve answers exactly one loopback GET and is gone (unit test)"
  - "decision_gate refuses a live block without its own key, with another key, after its stale date or without the game's date (unit test)"
  - "shadow runs with freight-margin@2 on the three real captures are recorded"
validation:
  - "cargo test --release --offline --manifest-path tools/research/mcp-rhai/Cargo.toml --bin battlebrain --bin mcp-panel --bin mcp-plan"
  - "tools/gate.sh change"
evidence_required:
  - validation_run
