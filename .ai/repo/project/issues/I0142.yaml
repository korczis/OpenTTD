id: I0142
milestone: the-planner-reads-one-coherent-priced-world
title: "A read-only openttd://subsidies resource lists every offered and awarded subsidy with its cargo, ends, award company and remaining time, from the game's own subsidy pool"
slug: subsidies-resource
priority: p2
profile: implementation
parallel_safe: false
objective: "Publish openttd://subsidies from the Subsidy pool: per subsidy its cargo, source and destination (type and id), whether it is awarded and to which company, the months remaining, and the payment multiplier the current difficulty gives, read-only and listed in the catalogue."
why: "External review 2026-11-22 (digest B-04). The resource table (src/prismatic_mcp/prismatic_mcp_server.cpp:329-350) has no subsidies entry; subsidies reach an agent only as news of type 'subsidies' (prismatic_mcp_view.cpp:400) or through the generic Script API tools. `git grep -i subsid` in tools/research/mcp-rhai/src finds only a comment (panel.rs:1221)."
scope:
  - "src/prismatic_mcp/prismatic_mcp_world.cpp"
  - "src/prismatic_mcp/prismatic_mcp_server.cpp"
  - "src/tests/test_prismatic_mcp.cpp"
  - "research/prismatic-mcp/07-resource-catalog.md"
non_scope:
  - "Creating or awarding a subsidy"
  - "Valuing a subsidy in the planner (I0143)"
depends_on:
  - I0141
serves:
  - "an-agent-plays-the-game-through-governed-channels#the-planner-reads-one-coherent-priced-world"
acceptance_criteria:
  - "An offered and an awarded subsidy appear with their fields (unit test on a created pool)"
  - "The resource is in resources/list, is readable through read_many and is counted by openttd://mcp/coverage"
validation:
  - "build-mcp/openttd_test '[prismatic_mcp]'"
  - "tools/gate.sh change"
evidence_required:
  - validation_run
