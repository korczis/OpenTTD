id: I0207
milestone: the-panel-has-integrity
title: "The cluster is an ECharts topology graph of instances and their real relationships, derived from the registry and probes, with an accessible table, filters and an inspector"
slug: cluster-topology-view
priority: p2
profile: implementation
parallel_safe: false
objective: "Draw the cluster card (and the hub's instance view) as an ECharts graph series through components.js `ecInit`, registered with its address parameters and maximizable: nodes are the registry's instances (panel, game server, GUI client, hub), edges are relationships the records and probes give (a client's `panel`, a server reached `via` its owning panel, the hub's `--panel`, the bus and store a panel publishes), coloured by the six health states of I0206. A filter by kind and state, an inspector for the picked node (its record, its probes, links to its panel and catalogue) and the same rows as a table for screen readers and the phone width. Nothing is listed by hand."
why: "External review 2026-11-22 (digest A-53). The cluster is still a table: static/app.js:58-61 `clusterHtml` and the card at static/index.html:187; the hub's `instancesView` is a table too (static/components.js:258). The relationships are already in the data, unused: a client record carries `panel` (panel.rs:1832-1833), a server without a token is reached through its owning panel (panel.rs:1529-1531), and the panel's record names its bus and store (bin/mcp-panel.rs:198-200). Rule project.panel-charts-go-through-one-layer requires ecInit, a registry entry, address state and maximize."
scope:
  - "tools/research/mcp-panel/static/app.js"
  - "tools/research/mcp-panel/static/index.html"
  - "tools/research/mcp-panel/static/components.js"
  - "tools/research/mcp-panel/static/hub.html"
  - "tools/research/mcp-panel/test/app.test.mjs"
  - "tools/research/mcp-panel/test/components.test.mjs"
  - "tools/research/mcp-overview-check"
non_scope:
  - "The machine-level Mesh page (static/mesh.js), which keeps its own view of Majordomus peers and nodes"
  - "Three.js or a second graph library"
depends_on:
  - I0206
serves:
  - "openttd-validates-agent-driven-engineering#every-panel-control-works"
acceptance_criteria:
  - "The cluster graph is created only by ecInit, is in the chart registry with its address keys, maximizes and restores on Escape"
  - "Every edge is derived from a record or probe field; a test builds the graph from fixture registry records and asserts nodes, edges and states"
  - "Filter and pick live in the address and survive a reload; the inspector links the node's panel, catalogue and record"
  - "The table holds the same rows as the graph, and at 390 px the page has no sideways scroll; mcp-overview-check (or the page check that covers the home page) drives it"
validation:
  - "node --test tools/research/mcp-panel/test/*.test.mjs"
  - "tools/research/e2e-coverage"
evidence_required:
  - validation_run
created_at: '2026-11-22'
updated_at: '2026-11-22'
