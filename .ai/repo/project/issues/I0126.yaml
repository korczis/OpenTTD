id: I0126
milestone: prismatic-ai-grows-its-fleet-and-survives-its-own-failures
title: "PrismaticAI's fleet grows before it is rich: the early purchase gates are AI settings, and the binding one is loosened only on held-start pairs"
slug: prismatic-ai-early-fleet-growth
priority: p1
profile: deep-work
parallel_safe: false
objective: "Turn the hard-coded early growth gates into CONFIG_INGAME settings with today's values as defaults (bit-for-bit on the fitness seed), then loosen the gate I0125 shows binding, changing a default only when held-start pairs on three seeds favour it beyond the opponent's spread."
why: "External review 2026-11-22 (digest C-25): from 1970 to 1980 the fleet went 43 to 55 while cash went 4.2M to 15.7M. PR #46 (4c1dc9c355) lifts caps only once the bank holds rich_budgets line budgets (tools/research/prismatic-ai/PrismaticAI/rich.nut Rich). Below that, InvestSurplus buys nothing until usable money reaches max(invest_min, 20 x cash_reserve), 500k at the defaults (fleet.nut:60,71), it buys one vehicle per heartbeat (main.nut:597), and AdjustFleet stops at 4 planes (8 with the steward) and 8 road vehicles per route, constants rather than settings (fleet.nut:165)."
scope:
  - "tools/research/prismatic-ai/PrismaticAI/fleet.nut"
  - "tools/research/prismatic-ai/PrismaticAI/info.nut"
  - "tools/research/prismatic-ai/PrismaticAI/main.nut"
  - "tools/research/prismatic-ai/README.md"
  - "research/results/**"
non_scope:
  - "The rich-growth mechanisms of PR #46 (rich.nut), which already act above the threshold"
  - "Rail growth, which goes through lines.nut and the steward"
depends_on:
  - I0125
serves:
  - "the-research-bot-competes-and-its-losses-are-explained#prismatic-ai-grows-and-recovers"
acceptance_criteria:
  - "INVEST_SURPLUS_RESERVES and AdjustFleet's per-type caps are AI settings; with their defaults the fitness seed reproduces the previous standings bit for bit"
  - "The gate I0125 measured as binding is loosened in an ablation on three held-start seeds, recorded under research/results/"
  - "A default changes only if those pairs favour it beyond the opponent's spread; otherwise the record says inconclusive and the default stays"
  - "The bot README's settings table is regenerated by derive_docs.py"
validation:
  - "python3 -B tools/research/prismatic-ai/derive_docs.py --check"
  - "python3 -m unittest tools/research/test_ai_battle.py tools/research/test_prismatic_ai_docs.py"
  - "python3 tools/research/ai-battle/battle.py fitness"
  - "python3 tools/research/ai-battle/battle.py check"
evidence_required:
  - validation_run
  - artifact
created_at: '2026-11-22'
updated_at: '2026-11-22'
