objective: "Run battle-postmortem on edition a80cc94a275dbec1 and battle-brain over its result, commit both outputs, choose one proposal with the reason, and test it paired: the same held start, three seeds, one named opponent (AAAHogEx or the strongest available), proposal versus current default. Change the default only if the effect exceeds the opponent's own spread across the seeds; otherwise record the null result."
