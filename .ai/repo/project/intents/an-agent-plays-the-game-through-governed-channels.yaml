id: an-agent-plays-the-game-through-governed-channels
title: "An external agent observes and steers a company only through governed channels that keep the simulation deterministic"
statement: "Prismatic, or any external agent, observes a running OpenTTD game and steers a company through channels that never bypass the command system: a standalone bridge that drives a Company AI over the admin network, and an embedded loopback MCP server whose every mutation is bound to an operator's approval of its exact arguments and is executed as a normal command."
invariants:
- "Game state changes only through registered commands (rule project.game-state-mutates-only-through-commands)"
- "Agent channels bind to loopback or the admin network, never a public interface without protection"
- No savegame field is added for an agent channel
non_goals:
- Autonomous mutation without an operator's approval
- A new command added only for an agent's convenience
milestones:
- prismatic-steers-a-company-through-the-bridge
- an-agent-reaches-the-game-over-mcp
- planning-is-generated-from-recorded-history
- rhai-is-a-live-ide
- the-planner-reads-one-coherent-priced-world
- battlebrain-decides-live-with-rollback
- prismatic-closes-one-real-loop
- governed-access-is-authenticated-and-every-capability-reaches-every-surface
- algoglyph-is-accountable
- a-remote-human-plays-the-bot
satisfaction:
- id: the-bridge-steers-a-company
  criterion: "A Company AI started over rcon by the bridge builds a route on a live server"
  evidence: command
  ref: "tools/research/bridge-live-check (written by I0025): polls /companies until vehicles > 0"
- id: a-decision-contract-is-defined
  criterion: "/decision/pull has a written request and response schema in this repository, with example fixtures that validate against it"
  evidence: command
  ref: "python3 -m jsonschema -i research/prismatic-bridge/decision-contract.example.json research/prismatic-bridge/decision-contract.schema.json"
- id: the-bridge-client-placement-is-decided
  criterion: "An accepted ADR records where the bridge's admin-protocol client lives and in what language"
  evidence: command
  ref: majordomus adr list --status accepted
- id: mcp-reads-live-state
  criterion: "An MCP client reads live pool state over loopback with bearer auth"
  evidence: command
  ref: "tools/research/mcp-live-check (written by I0017): initialize + resources/read with good, missing and wrong bearer and an Origin header"
- id: mcp-mutation-is-approved-and-commanded
  criterion: "The digest and auth helpers and the approval state machine (submit, approve, execute via Command<>::Post; replay and changed arguments refused) are covered by tests that run"
  evidence: command
  ref: "build-mcp/openttd_test '[prismatic_mcp]' && ctest --test-dir build-mcp --no-tests=error -R 'prismatic_mcp'"
- id: mcp-is-on-master
  criterion: "The MCP server series is on master on top of the current upstream and builds with both options ON"
  evidence: command
  ref: "git merge-base --is-ancestor research/prismatic-mcp-server master"
- id: agent-reads-do-not-perturb-the-game
  criterion: "A seeded run hammered with MCP reads ends in the same game state as an idle run of the same seed"
  evidence: command
  ref: "tools/research/research report --experiment-id <determinism-ab-id>"
- id: a-bot-plays-for-the-owner
  criterion: "An AI company plays for the owner within knobs the owner sets and changes while it runs (routes, vehicles per route, cash reserve), from the panel, the REST/OpenAPI surface and Rhai, and its log reaches the event feed"
  evidence: command
  ref: "tools/research/mcp-rhai/target/release/mcp-rhai -e 'import \"ttd\" as ttd; ttd::bot_log(5)'"
- id: decisions-publish-structured-events
  criterion: "Every planning decision publishes a plan.* event with its inputs (live reads and store queries, or the fallback it took), its choice and its version, and Prismatic, AlgoGlyph and mcp-duel read those events or the store instead of console prose (ADR 0034)"
  evidence: command
  ref: "tools/research/mcp-panel-check (extended by I0081): a planned bot start leaves plan.portfolio and plan.bot_settings on the bus and in the store's events"
- id: history-tuning-is-held-start-proven
  criterion: "A bot default derived from recorded history replaced a hand constant only after held-start duel pairs on three seeds favoured it beyond the rival's spread, and the pairs are recorded under research/results/"
  evidence: command
  ref: "PRISMATIC_START_PAUSED=2 tools/research/mcp-duel --seed <4242|31337|20208>, paired (I0087)"
- id: rhai-is-a-live-ide
  criterion: "A Rhai script is edited with completion and lint, run, stopped at a breakpoint and inspected on the panel's Scripts page, shares memory with other scripts, and calls Prismatic over loopback with 100% covered, gate-enforced code"
  evidence: command
  ref: "tools/research/mcp-scripts-check and cargo llvm-cov on tools/research/mcp-rhai (I0088-I0093)"
- id: the-planner-reads-one-coherent-priced-world
  criterion: "Every planner read path (mcp-plan, mcp-intent, algoglyph.track_plan) takes its world at one game tick or refuses with a reason, every plan names its snapshot and is priced from the game's own income quote, and a plan whose snapshot no longer holds is refused before any setting applies"
  evidence: command
  ref: "cargo test --release --offline --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-plan --bin mcp-intent --bin mcp-hub && build-mcp/openttd_test '[prismatic_mcp]'"
- id: battlebrain-decides-live-with-rollback
  criterion: "A Battlebrain freight-line decision made on a coherent snapshot was applied live through its cutover gates as one expiring openttd.ai.set_settings approval, its outcome recorded, and the rollback switch returned the bot to planned_freight_only=0 read back from the game; no other writer set an fr_* slot for that company"
  evidence: command
  ref: "tools/research/battlebrain-live-check (written by I0152): coherent capture, battlebrain live, one keyed pull, read-back, rollback, read-back"
- id: prismatic-closes-one-real-loop
  criterion: "One recorded run links an evidence query, typed mesh records, a decision made live by prismatic_api (not a stand-in), an approval by an authenticated operator for its exact arguments, the command the game executed and its effect read back a game month later; a frozen-input ablation says whether Prismatic changed the decision, and stopping the run leaves no listener"
  evidence: command
  ref: "tools/research/agent-loop-check (written by I0178): exit 0 with a run record, exit 3 NOT RUN when prismatic_api or majordomus 1.2.0 is absent"
- id: governed-access-is-authenticated-and-exercised
  criterion: "Every approval records a principal authenticated from the credential that carried it, never a declared name; a parity matrix generated from the live registries shows every capability on every surface and fails on a missing projection; and a live probe exercises the MCP catalogue, counted by validated outcome, above a gate-enforced floor"
  evidence: command
  ref: "tools/research/mcp-parity-check <panel-url> && tools/research/mcp-coverage-check --probe --report <token-file> && cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml"
- id: algoglyph-plans-are-accountable
  criterion: "Every AlgoGlyph track plan the fork executes leaves a replayable receipt joined to its observed build, with predicted against actual cost and a verdict; a cost fixture matrix and a fault-injection suite pass, and a missing AlgoGlyph is reported as NOT RUN"
  evidence: command
  ref: "cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml track_fixture && cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml algoglyph_fault"
- id: a-remote-human-plays-the-bot
  criterion: "A client outside the host's network joins the owner's invite-only research server through the game coordinator, and a remote person plays a recorded game against the disclosed bot with auto-approve off; research/real-game.md no longer lists either as NOT RUN"
  evidence: command
  ref: "test -z \"$(grep -E 'remote human joining|invite-only game through' research/real-game.md | grep 'NOT RUN')\""
created_at: '2026-11-15'
updated_at: '2026-11-22'
