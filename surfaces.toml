# Published surfaces of this repository: tools/surfaces/README.md.
# Only the choices data cannot make are declared here; every page, table and chart is derived.

[sources]
# Every tracked Markdown document is published, upstream's included; vendored third-party
# trees are not this repository's documentation.
exclude = ["src/3rdparty/**"]

[check]
# Upstream documents are carried unmodified (ADR 0011): their links are upstream's to keep.
exclude = ["changelog.md"]
# Rules vendored from Majordomus carry front matter that does not parse as YAML (an unquoted ": ").
# They are fixed upstream and replaced on the next vendor update, never edited here.
front_matter_exclude = [".ai/repo/rules/vendor/**"]
# One visualization layer per kind of view (the owner's order; rule project.docs-are-derived-and-current):
# ECharts for charts and graphs, D3 for bespoke layouts and force physics, three.js for 3D, p5 for
# generative art, Mermaid for diagrams in Markdown. A library listed here fails the check wherever
# a manifest depends on it, a page loads it or code imports it; the value names what to use instead.
libraries = { "chart.js" = "Apache ECharts", "cytoscape" = "Apache ECharts (graph series) or D3", "highcharts" = "Apache ECharts", "plotly.js" = "Apache ECharts", "vis-network" = "Apache ECharts (graph series) or D3" }

# Numbers the README and other documents state, each counted from the tracked files on every
# sync by the `facts` region (tools/surfaces/README.md). Only what to count is declared here.
[[facts.items]]
id = "game-commands"
group = "mcp"
short = "game commands (openttd.cmd.*)"
label = "game commands, each an MCP tool an agent can call (`openttd.cmd.*`)"
matches = 'DEF_CMD_TRAIT\(Commands::'
in = "src/*_cmd.h"
link = "research/mcp-api.md"

[[facts.items]]
id = "mcp-resources"
group = "mcp"
short = "live resources (openttd://)"
label = "live MCP resources (`openttd://…`): map, towns, stations, vehicles, companies, …"
matches = '^\s*\{"openttd://'
in = "src/prismatic_mcp/prismatic_mcp_server.cpp"
link = "research/prismatic-mcp/07-resource-catalog.md"

[[facts.items]]
id = "mcp-unit-tests"
group = "proof"
label = "unit test cases for the MCP server (Catch2, `[prismatic_mcp]`)"
matches = '^TEST_CASE\('
in = "src/tests/test_prismatic_mcp.cpp"
link = "research/prismatic-mcp/09-testing.md"

[[facts.items]]
id = "duels"
group = "proof"
label = "recorded bot-vs-bot duels, each with its JSON and its write-up"
files = "research/results/duel-*.json"
link = "tools/research/mcp-duel"

[[facts.items]]
id = "research-tools"
group = "tooling"
label = "research tools and checks (`tools/research/*`, shell and Python)"
files = "tools/research/*"
link = "research/tooling.md"

[[facts.items]]
id = "rust-tools"
group = "tooling"
label = "Rust programs: panel, hub, planner, Rhai runner, coverage, …"
files = "tools/research/mcp-rhai/src/bin/*.rs"
link = "research/mcp-control.md"

[[facts.items]]
id = "rhai-scripts"
group = "tooling"
label = "Rhai scripts that drive a live game (director, narrator, steward, …)"
files = "tools/research/mcp-panel/rhai/*.rhai"
link = "research/mcp-control.md"

[[facts.items]]
id = "decisions"
group = "record"
label = "architecture decisions (ADRs)"
files = ".ai/repo/adrs/0*.md"
link = ".ai/repo/adrs/README.md"

[[facts.items]]
id = "issues"
group = "record"
label = "planned issues, each with its evidence"
files = ".ai/repo/project/issues/*.yaml"
link = ".ai/repo/project/README.md"

[[facts.items]]
id = "knowledge"
group = "record"
label = "knowledge records (curated and candidates)"
files = ".ai/repo/knowledge/*/*.md"
link = ".ai/repo/knowledge/README.md"

[[facts.items]]
id = "documents"
group = "record"
label = "published documents on the site and the wiki"
docs = ""
# Nearly every pull request adds a document, so this number in README.md made every two open pull
# requests conflict on one line; it is shown on the site's overview, computed at build time.
site_only = true

# Tools that own derived text the regions do not: their own markers, or whole generated files.
# `surfaces sync` runs every `sync` before it regenerates the regions, and `surfaces check` (the
# commit hook, `tools/gate.sh change`, CI) runs every `check`, so one command updates every derived
# document and one gate proves them all current. A generator with no `sync` is regenerated by its
# own workflow. A record's JSON is written only by its own tool (`mcp-duel`, `mcp-ab`,
# `battle.py report`, `battle.py ablate --write`); its page's tables and charts are re-derived from
# that JSON here, so a renderer change reaches every page in the commit that makes it.
[[generators.items]]
id = "readme-scoreboard"
outputs = ["README.md"]
sync = ["tools/research/readme-scoreboard"]
check = ["tools/research/readme-scoreboard", "--check"]

[[generators.items]]
id = "prismatic-mcp-docs"
outputs = ["README.md", "research/prismatic-mcp/README.md"]
sync = ["python3", "-B", "tools/research/generate_prismatic_docs.py"]
check = ["tools/check-prismatic-docs.sh"]

[[generators.items]]
id = "ingame-menu"
outputs = ["research/prismatic-mcp/README.md"]
sync = ["python3", "-B", "tools/research/prismatic-mcp-menu"]
check = ["python3", "-B", "tools/research/prismatic-mcp-menu", "--check"]

[[generators.items]]
id = "town-model"
outputs = ["research/mechanisms/town-authority.md", "tools/research/town-model/town_model.json"]
sync = ["python3", "-B", "tools/research/town-model/derive.py"]
check = ["python3", "-B", "tools/research/town-model/derive.py", "--check"]

[[generators.items]]
id = "prismatic-ai-docs"
outputs = ["tools/research/prismatic-ai/README.md"]
sync = ["python3", "-B", "tools/research/prismatic-ai/derive_docs.py"]
check = ["python3", "-B", "tools/research/prismatic-ai/derive_docs.py", "--check"]

[[generators.items]]
id = "ai-battle"
outputs = ["research/ai-battle/README.md", "research/results"]
sync = ["python3", "-B", "tools/research/ai-battle/battle.py", "render"]
check = ["python3", "-B", "tools/research/ai-battle/battle.py", "check"]

# PrismaticAI against its field and the post-mortems (research/strategy/README.md), derived from
# the ablation records' standings and the research documents' lead paragraphs.
[[generators.items]]
id = "strategy-state"
outputs = ["research/strategy/README.md"]
sync = ["tools/research/strategy-surfaces", "render"]
check = ["tools/research/strategy-surfaces", "render", "--check"]

[[generators.items]]
id = "duel-charts"
outputs = ["research/results"]
sync = ["tools/research/mcp-duel", "--render"]
check = ["tools/research/mcp-duel", "--render", "--check"]

[[generators.items]]
id = "ab-charts"
outputs = ["research/results"]
sync = ["tools/research/mcp-ab", "--render"]
check = ["tools/research/mcp-ab", "--render", "--check"]

# The Rust benchmark records (research/rust-bench.md): each bench-*.json is written by
# `rust-bench run`; its page is re-derived from it here.
[[generators.items]]
id = "rust-bench"
outputs = ["research/results"]
sync = ["tools/research/rust-bench", "render"]
check = ["tools/research/rust-bench", "render", "--check"]

[[generators.items]]
id = "atlas"
outputs = ["README.md", "docs/atlas/hero-light.svg", "docs/atlas/hero-dark.svg"]
sync = ["tools/research/atlas/atlas", "render"]
check = ["tools/research/atlas/atlas", "render", "--check"]

# The capability matrix promises a `path:line` for every code path: each is cited anchored
# (`path:line:Symbol`) and must still hold its symbol on master. `sync` moves a line whose symbol
# moved when its new line is unambiguous; a symbol that is gone, or moved ambiguously, fails until a
# person edits the row.
[[generators.items]]
id = "capability-matrix-refs"
outputs = ["research/capability-matrix.md"]
sync = ["tools/knowledge/refs", "check", "--pathspec", "research/capability-matrix.md", "--strict-lines", "--fix-lines"]
check = ["tools/knowledge/refs", "check", "--pathspec", "research/capability-matrix.md", "--strict-lines"]

# A feature record's maturity cites its evidence by anchored line (`path:line:Symbol`; I0112,
# .ai/repo/features/README.md "Maturity levels"): `sync` moves a line whose symbol moved, and a
# cited file, symbol or line that is gone fails until the record is re-graded.
[[generators.items]]
id = "feature-maturity-refs"
outputs = [".ai/repo/features"]
sync = ["tools/knowledge/refs", "check", "--pathspec", ":(glob).ai/repo/features/*.md", "--strict-lines", "--fix-lines"]
check = ["tools/knowledge/refs", "check", "--pathspec", ":(glob).ai/repo/features/*.md", "--strict-lines"]

# Pages of the site beyond the documents, each drawn by its own script from a JSON data contract
# that a declared command prints when the site is built (tools/surfaces/README.md, "Declared pages").
# The cards the data carries are rendered as plain HTML; the script draws the interactive views; the
# scenario under `e2e` is what tools/surfaces/pages-check drives in Chrome.
[[pages.items]]
id = "atlas"
title = "Research Atlas"
summary = "Every recorded duel, A/B and LAN battle record, and the README's own diagrams, as views you drive: filter, compare, follow a seed through the bot's revisions, walk the architecture. Each record is classed by what it can support, and every mark opens its evidence."
data = ["tools/research/atlas/atlas", "data"]
script = "tools/research/atlas/atlas.js"
e2e = "tools/research/atlas/atlas.e2e.mjs"

# Feature maturity (tools/surfaces/maturity.py, I0112): every feature record's status is one of
# these levels, and its `## Maturity` section carries one `- **label**:` line per required piece of
# evidence, each citing a tracked path, an issue or a pull request. What each level means and how to
# check each label is defined once, in the document `definition` names.
[features]
definition = ".ai/repo/features/README.md#maturity-levels"
levels = { stable = { requires = ["shipped", "tested", "gated", "documented"] }, draft = { requires = ["missing"], allows = ["shipped", "tested", "gated", "documented"] }, deprecated = { requires = ["replaced"] } }

# Open findings (tools/surfaces/README.md, "Open findings"): what the records say is missing,
# blocked, handed off, not run or failed, rendered by the `open-findings` region of
# research/open-findings.md. tools/surfaces/findings.py names no fact of this repository; only
# where to look and the vocabulary the records use are declared here.
[findings]
# Every kind a finding may carry, in the order the page lists them. `blocked` and `out-of-scope`
# are the generator's own; the others are this repository's statuses and marker kinds.
kinds = { "blocked" = "An open issue waits on an issue that is not done; the follow-up is what it waits on", "out-of-scope" = "A finished issue left this out (its non_scope) and no open issue names it", "failed" = "A run or check the records say failed", "not-run" = "A validation the records say did not run", "partial" = "A capability or run the records say is only partly there", "staged" = "Designed and written down, not implemented", "handoff" = "A change asked of another repository; nothing in this one can close it", "unreviewed" = "A knowledge record still awaiting its review", "drift" = "An issue's stamps contradict its delivered work (live only: majordomus plan drift)" }
# The fail-closed status vocabulary (research/README.md) and the kind each open status files under.
statuses = { "NOT RUN" = "not-run", "PARTIAL" = "partial", "FAIL" = "failed", "STAGED" = "staged" }
# The plan: blocked issues, non_scope entries of finished issues, evidence reporting an open status.
issues = { in = ".ai/repo/project/issues/*.yaml", id = 'I\d{4}', non_scope_of = ["done"] }
# Status columns of research tables; the vocabulary's own definition table is not a finding.
tables = { in = ["research/**/*.md", ".ai/repo/knowledge/curated/*.md"], columns = ["Status", "State"], exclude = ["research/concepts/evidence-and-validation-status.md"] }
# Knowledge candidates awaiting the owner's review.
front_matter = [{ in = ".ai/repo/knowledge/candidates/*.md", field = "status", values = ["candidate"], kind = "unreviewed" }]
# Passages a document marks <!-- open-finding kind=K [follow-up=ID] --> (handoffs, recorded failures).
markers = { in = ["**/*.md"], exclude = ["src/3rdparty/**"] }
# Answers that depend on the moment: printed by `findings.py --live`, never committed.
live = [{ id = "plan-drift", kind = "drift", command = ["majordomus", "plan", "drift", "--json"], items = "findings", keep = { class = ["merged_not_recorded", "active_without_work"] }, record = "issue", text = ["class", "remedy"] }]
