# Published surfaces of this repository: tools/surfaces/README.md.
# Only the choices data cannot make are declared here; every page, table and chart is derived.

[sources]
# Every tracked Markdown document is published, upstream's included; vendored third-party
# trees are not this repository's documentation.
exclude = ["src/3rdparty/**"]

[check]
# Upstream documents are carried unmodified (ADR 0011): their links are upstream's to keep.
exclude = ["changelog.md"]
# Rules vendored from Majordomus carry front matter that does not parse as YAML (an unquoted ": ").
# They are fixed upstream and replaced on the next vendor update, never edited here.
front_matter_exclude = [".ai/repo/rules/vendor/**"]
# One visualization layer per kind of view (the owner's order; rule project.docs-are-derived-and-current):
# ECharts for charts and graphs, D3 for bespoke layouts and force physics, three.js for 3D, p5 for
# generative art, Mermaid for diagrams in Markdown. A library listed here fails the check wherever
# a manifest depends on it, a page loads it or code imports it; the value names what to use instead.
libraries = { "chart.js" = "Apache ECharts", "cytoscape" = "Apache ECharts (graph series) or D3", "highcharts" = "Apache ECharts", "plotly.js" = "Apache ECharts", "vis-network" = "Apache ECharts (graph series) or D3" }

# Numbers the README and other documents state, each counted from the tracked files on every
# sync by the `facts` region (tools/surfaces/README.md). Only what to count is declared here.
[[facts.items]]
id = "game-commands"
group = "mcp"
short = "game commands (openttd.cmd.*)"
label = "game commands, each an MCP tool an agent can call (`openttd.cmd.*`)"
matches = 'DEF_CMD_TRAIT\(Commands::'
in = "src/*_cmd.h"
link = "research/mcp-api.md"

[[facts.items]]
id = "mcp-resources"
group = "mcp"
short = "live resources (openttd://)"
label = "live MCP resources (`openttd://…`): map, towns, stations, vehicles, companies, …"
matches = '^\s*\{"openttd://'
in = "src/prismatic_mcp/prismatic_mcp_server.cpp"
link = "research/prismatic-mcp/07-resource-catalog.md"

[[facts.items]]
id = "mcp-unit-tests"
group = "proof"
label = "unit test cases for the MCP server (Catch2, `[prismatic_mcp]`)"
matches = '^TEST_CASE\('
in = "src/tests/test_prismatic_mcp.cpp"
link = "research/prismatic-mcp/09-testing.md"

[[facts.items]]
id = "duels"
group = "proof"
label = "recorded bot-vs-bot duels, each with its JSON and its write-up"
files = "research/results/duel-*.json"
link = "tools/research/mcp-duel"

[[facts.items]]
id = "research-tools"
group = "tooling"
label = "research tools and checks (`tools/research/*`, shell and Python)"
files = "tools/research/*"
link = "research/tooling.md"

[[facts.items]]
id = "rust-tools"
group = "tooling"
label = "Rust programs: panel, hub, planner, Rhai runner, coverage, …"
files = "tools/research/mcp-rhai/src/bin/*.rs"
link = "research/mcp-control.md"

[[facts.items]]
id = "rhai-scripts"
group = "tooling"
label = "Rhai scripts that drive a live game (director, narrator, steward, …)"
files = "tools/research/mcp-panel/rhai/*.rhai"
link = "research/mcp-control.md"

[[facts.items]]
id = "decisions"
group = "record"
label = "architecture decisions (ADRs)"
files = ".ai/repo/adrs/0*.md"
link = ".ai/repo/adrs/README.md"

[[facts.items]]
id = "issues"
group = "record"
label = "planned issues, each with its evidence"
files = ".ai/repo/project/issues/*.yaml"
link = ".ai/repo/project/README.md"

[[facts.items]]
id = "knowledge"
group = "record"
label = "knowledge records (curated and candidates)"
files = ".ai/repo/knowledge/*/*.md"
link = ".ai/repo/knowledge/README.md"

[[facts.items]]
id = "documents"
group = "record"
label = "published documents on the site and the wiki"
docs = ""

# Tools that own derived text the regions do not: their own markers, or whole generated files.
# `surfaces sync` runs every `sync` before it regenerates the regions, and `surfaces check` (the
# commit hook, `tools/gate.sh change`, CI) runs every `check`, so one command updates every derived
# document and one gate proves them all current. A generator with no `sync` is regenerated by its
# own workflow. A record's JSON is written only by its own tool (`mcp-duel`, `mcp-ab`,
# `battle.py report`, `battle.py ablate --write`); its page's tables and charts are re-derived from
# that JSON here, so a renderer change reaches every page in the commit that makes it.
[[generators.items]]
id = "readme-scoreboard"
outputs = ["README.md"]
sync = ["tools/research/readme-scoreboard"]
check = ["tools/research/readme-scoreboard", "--check"]

[[generators.items]]
id = "prismatic-mcp-docs"
outputs = ["README.md", "research/prismatic-mcp/README.md"]
sync = ["python3", "-B", "tools/research/generate_prismatic_docs.py"]
check = ["tools/check-prismatic-docs.sh"]

[[generators.items]]
id = "ingame-menu"
outputs = ["research/prismatic-mcp/README.md"]
sync = ["python3", "-B", "tools/research/prismatic-mcp-menu"]
check = ["python3", "-B", "tools/research/prismatic-mcp-menu", "--check"]

[[generators.items]]
id = "town-model"
outputs = ["research/mechanisms/town-authority.md", "tools/research/town-model/town_model.json"]
sync = ["python3", "-B", "tools/research/town-model/derive.py"]
check = ["python3", "-B", "tools/research/town-model/derive.py", "--check"]

[[generators.items]]
id = "prismatic-ai-docs"
outputs = ["tools/research/prismatic-ai/README.md"]
sync = ["python3", "-B", "tools/research/prismatic-ai/derive_docs.py"]
check = ["python3", "-B", "tools/research/prismatic-ai/derive_docs.py", "--check"]

[[generators.items]]
id = "ai-battle"
outputs = ["research/ai-battle/README.md", "research/results"]
sync = ["python3", "-B", "tools/research/ai-battle/battle.py", "render"]
check = ["python3", "-B", "tools/research/ai-battle/battle.py", "check"]

[[generators.items]]
id = "duel-charts"
outputs = ["research/results"]
sync = ["tools/research/mcp-duel", "--render"]
check = ["tools/research/mcp-duel", "--render", "--check"]

[[generators.items]]
id = "ab-charts"
outputs = ["research/results"]
sync = ["tools/research/mcp-ab", "--render"]
check = ["tools/research/mcp-ab", "--render", "--check"]
